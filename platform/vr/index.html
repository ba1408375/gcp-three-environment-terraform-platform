<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VR Service</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px system-ui; color: #f2efff; background: radial-gradient(circle at top, #553c9a, #111126 65%); }
    main { width: min(680px, 86vw); padding: 2rem; border: 1px solid #a78bfa66; border-radius: 18px; background: #111126cc; box-shadow: 0 24px 80px #0008; }
    code { color: #c4b5fd; }
    #status { padding: .8rem 1rem; border-radius: 10px; background: #28204d; }
  </style>
</head>
<body>
  <main>
    <p>DevCloud platform</p>
    <h1>Virtual Reality endpoint</h1>
    <p>This Google Cloud-hosted endpoint is ready for immersive VR/WebXR applications.</p>
    <p id="status">Checking this browser for immersive VR support…</p>
    <p>Health path: <code>/healthz</code> (served by Nginx with the same static service).</p>
  </main>
  <script>
    const status = document.getElementById('status');
    if (!navigator.xr) {
      status.textContent = 'WebXR is unavailable in this browser or the page is not using a secure context.';
    } else {
      navigator.xr.isSessionSupported('immersive-vr').then(function (supported) {
        status.textContent = supported ? 'Immersive VR is supported on this device.' : 'The endpoint is online; this device does not support immersive VR.';
      });
    }
  </script>
</body>
</html>
