<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AR Service</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px system-ui; color: #e8fff8; background: radial-gradient(circle at top, #12645b, #071b24 65%); }
    main { width: min(680px, 86vw); padding: 2rem; border: 1px solid #4bd8bb66; border-radius: 18px; background: #071b24cc; box-shadow: 0 24px 80px #0008; }
    code { color: #79f2d0; }
    #status { padding: .8rem 1rem; border-radius: 10px; background: #0f3340; }
  </style>
</head>
<body>
  <main>
    <p>DevCloud platform</p>
    <h1>Augmented Reality endpoint</h1>
    <p>This Google Cloud-hosted endpoint is ready for AR/WebXR assets and applications.</p>
    <p id="status">Checking this browser for immersive AR support…</p>
    <p>Health path: <code>/healthz</code> (served by Nginx with the same static service).</p>
  </main>
  <script>
    const status = document.getElementById('status');
    if (!navigator.xr) {
      status.textContent = 'WebXR is unavailable in this browser or the page is not using a secure context.';
    } else {
      navigator.xr.isSessionSupported('immersive-ar').then(function (supported) {
        status.textContent = supported ? 'Immersive AR is supported on this device.' : 'The endpoint is online; this device does not support immersive AR.';
      });
    }
  </script>
</body>
</html>
